# Mijote en une commande : cp .env.example .env, puis docker compose up -d → http://localhost:3010
services:
  mijote:
    build: .
    image: mijote:latest
    restart: unless-stopped
    ports:
      - "${MIJOTE_PORT:-3010}:3010"
    env_file:
      - path: .env
        required: false
    volumes:
      - mijote-data:/data

  # Démo publique (docs/demo.md) : un foyer fictif prêt, une base par visiteur, effacée après inactivité ;
  # ni IA, ni catalogue, ni mot de passe. Rien à sauvegarder : pas de volume.
  # mijote-demo:
  #   image: mijote:latest
  #   restart: unless-stopped
  #   ports:
  #     - "${MIJOTE_DEMO_PORT:-3011}:3010"
  #   environment:
  #     MIJOTE_DEMO: "1"

volumes:
  mijote-data:
