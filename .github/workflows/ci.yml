name: CI
on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur une PR annule l'exécution précédente de la même PR ; sur main, chaque commit va au bout.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build, fumée
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          MIJOTE_DATA_DIR: /tmp/build-data
      - run: pnpm test:smoke

  # Vérification requise par la protection de main (même nom qu'avant) : verte seulement si les trois le sont.
  check:
    name: Types, tests, build, fumée
    needs: [typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Types : ${{ needs.typecheck.result }}, tests : ${{ needs.test.result }}, build et fumée : ${{ needs.build.result }}"
          [ "${{ needs.typecheck.result }}" = success ] && [ "${{ needs.test.result }}" = success ] && [ "${{ needs.build.result }}" = success ]

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image
        run: docker build -t mijote:ci .
      - name: Lancer le conteneur et vérifier la mise en route
        run: |
          docker run -d --name mijote -p 3010:3010 -e MIJOTE_PASSWORD=ci mijote:ci
          for i in $(seq 1 40); do curl -sf -o /dev/null http://localhost:3010/manifest.webmanifest && break; sleep 2; done
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:3010/recettes | tee /tmp/r
          grep -q '307 .*/connexion' /tmp/r
          TOKEN=$(printf 'mijote:ci' | sha256sum | cut -d' ' -f1)
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' -b "mijote.auth=$TOKEN" http://localhost:3010/recettes | tee /tmp/r
          grep -q '307 .*/bienvenue' /tmp/r
          curl -sf -b "mijote.auth=$TOKEN" http://localhost:3010/bienvenue | grep -q 'Bienvenue dans Mijote'
          docker logs mijote | grep -q "recette(s) importée(s)"
          docker exec mijote ls /data/mijote.db
      - if: failure()
        run: docker logs mijote || true
